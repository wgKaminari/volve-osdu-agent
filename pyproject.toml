[project]
name = "volve-osdu"
version = "0.1.0"
description = "AI agent that maps Equinor Volve well data into OSDU records, with provenance, validation and evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "langgraph>=1.2.20",
    "lasio>=0.32",
    "openai>=3.46.0",
    "osdu-python-models>=0.8.1",
    "pandas>=3.1.1",
    "pdfplumber>=0.11.10",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "xlrd>=2.0.2",
]

[project.scripts]
volve-osdu = "volve_osdu.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
